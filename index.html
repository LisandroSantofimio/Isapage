<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#A9606B">
  <title>For you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Gloock&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Screen 1: the question -->
  <main class="screen" id="ask">
    <h1 id="title"></h1>
    <p class="question" id="question"></p>
    <div class="buttons" id="buttons">
      <button type="button" class="btn btn-yes" id="yes">Yes</button>
      <button type="button" class="btn btn-no" id="no">No</button>
    </div>
  </main>

  <!-- Screen 2: the celebration -->
  <section class="screen" id="result" hidden aria-live="polite">
    <img class="sticker" id="sticker" alt="">
    <p class="result-text" id="resultText"></p>
  </section>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="js/script.js"></script>
</body>
</html>
